; The item names and descriptions' localization target, apart from the menus'. Run with:
; UnrealEditor-Cmd Alverion.uproject -run=GatherText -config=Config/Localization/Items.ini -unattended
; It gathers the ST_Items string table the item catalog registers, takes translations from each culture's Items.po,
; writes the archives and the .po files back with any new lines, and compiles the .locres the game loads.

[CommonSettings]
SourcePath=Content/Localization/Items
DestinationPath=Content/Localization/Items
ManifestName=Items.manifest
ArchiveName=Items.archive
PortableObjectName=Items.po
ResourceName=Items.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=el
CulturesToGenerate=es
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=pt
CulturesToGenerate=ru
CulturesToGenerate=zh

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Alverion/Private/Items
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
