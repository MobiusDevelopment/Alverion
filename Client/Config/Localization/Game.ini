; The menus' localization target. Run with:
; UnrealEditor-Cmd Alverion.uproject -run=GatherText -config=Config/Localization/Game.ini -unattended
; It gathers the CSV string table the game module registers, takes translations from each culture's Game.po,
; writes the archives and the .po files back with any new lines, and compiles the .locres the game loads.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=el
CulturesToGenerate=es
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=pt
CulturesToGenerate=ru
CulturesToGenerate=zh

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Alverion
; Item text has its own target, Items.ini.
ExcludePathFilters=Source/Alverion/Private/Items/*
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
