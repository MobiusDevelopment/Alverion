+DirectoriesToAlwaysCook=(Path="/Game/Equipment/Shared/Coverage")
+DirectoriesToAlwaysCook=(Path="/Game/Equipment/Shared/Hair")
+DirectoriesToAlwaysCook=(Path="/MetaHumanCharacter/Optional/Grooms/GroomAssets")
