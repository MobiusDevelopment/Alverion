; The menus' string table is a CSV read by path when the game module starts, so it is staged as a plain file.
+DirectoriesToAlwaysStageAsUFS=(Path="Localization/StringTables")
; The loading screen reads its art off disk, since the movie player cannot load a texture asset.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Splash")
; The engine stages English ICU data only, so the language list would fall back to raw codes; Greek, Portuguese and Russian are outside every preset but All.
